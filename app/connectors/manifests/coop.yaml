id: se.coop
name: Coop
country: SE
protocol_version: 1
connector_version: 0.1.0
enabled: true
# Owner decision 2026-11-26: private, targeted use of what a normal visitor can see.
access_review: approved
access_note: >-
  Uses the API coop.se's own pages call (external.api.coop.se) with the subscription key those
  pages send to every visitor, supplied as COOP_API_KEY. Coop publishes no developer programme,
  so this is undocumented and may change; a 401/403 pauses the connector. Targeted search and
  lookup only, spaced requests. No deal amounts are exposed anonymously, so no offers.
implementation: app.connectors.coop:CoopConnector
capabilities:
  store_discovery: supported
  product_search: supported
  barcode_search: supported
  online_prices: supported
  physical_store_prices: unsupported
  store_offers: unsupported
allowed_hosts: [external.api.coop.se]
store_discovery_requires_postcode: true
minimum_request_interval_seconds: 3
minimum_monitor_interval_minutes: 60
max_requests_per_scan: 6
max_requests_per_day: 400
cache_seconds: 600

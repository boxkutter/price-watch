services:
  api:
    build: .
    env_file: .env
    command: sh -c "alembic upgrade head && python -m app.bootstrap && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app --reload-dir connectors"
    ports: ["127.0.0.1:8085:8000"]
    # Development runs from the source tree, not the image: the code folders are mounted read-only
    # and uvicorn reloads on every change (static pages are read per request, so they update on a
    # browser refresh). Rebuild only when requirements.lock or the Dockerfile change.
    # connectors_data holds the connectors installed from the admin page. The `z` label lets
    # SELinux hosts (Fedora, RHEL) read the mounts; other systems ignore it.
    volumes:
      - ./app:/service/app:ro,z
      - ./connectors:/service/connectors:ro,z
      - ./static:/service/static:ro,z
      - ./migrations:/service/migrations:ro,z
      - ./docs/api.md:/service/docs/api.md:ro,z
      - connectors_data:/data/connectors
      # The Android app published by mobile/scripts/publish.sh, served at /download.
      - ./data/downloads:/data/downloads:ro,z
    environment:
      APP_DOWNLOADS_DIR: /data/downloads
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    # Restarts itself when the source changes.
    command: watchfiles --filter python "python -m app.worker" app connectors
    volumes:
      - ./app:/service/app:ro,z
      - ./connectors:/service/connectors:ro,z
      - connectors_data:/data/connectors
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: retail
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retail"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
  connectors_data:

id: se.coop
name: Coop
country: SE
description: Targeted product search, barcode lookup and per-store prices from coop.se.
author: price-watch
protocol_version: 1
connector_version: 0.1.0
enabled: true
# Owner decision 2026-11-26: private, targeted use of what a normal visitor can see.
access_review: approved
access_note: >-
  Uses the API coop.se's own pages call (external.api.coop.se) with the subscription key those
  pages send to every visitor, supplied as COOP_API_KEY. Coop publishes no developer programme,
  so this is undocumented and may change; a 401/403 pauses the connector. Targeted search and
  lookup only, spaced requests. No deal amounts are exposed anonymously, so no offers.
implementation: connector:CoopConnector
capabilities:
  store_discovery: supported
  product_search: supported
  barcode_search: supported
  online_prices: supported
  physical_store_prices: unsupported
  store_offers: unsupported
allowed_hosts: [external.api.coop.se]
# The product's EAN is the last part of the page address. The page itself is never fetched
# (www.coop.se is not an allowed host; only the API is).
product_urls:
  - pattern: '^https://(www\.)?coop\.se/handla/varor/.+-(?P<sku>\d{8,14})/?$'
    example: 'https://www.coop.se/handla/varor/skafferi/flingor-musli/gryn/havregryn-7300156599452/'
settings:
  - name: COOP_API_KEY
    label: Coop API subscription key
    description: >-
      The Ocp-Apim-Subscription-Key header coop.se's own pages send on requests to
      external.api.coop.se (see your browser's developer tools). Not a secret of ours; never
      commit it.
    secret: true
    required: true
store_discovery_inputs:
  - name: postcode
    label: Postcode
    pattern: '^\d{3}\s?\d{2}$'
    required: true
minimum_request_interval_seconds: 3
minimum_monitor_interval_minutes: 60
max_requests_per_scan: 6
max_requests_per_day: 400
cache_seconds: 600

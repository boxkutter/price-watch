id: se.ica
name: ICA
country: SE
description: Targeted product search, product-link lookup and multibuy offers from ICA's online shop.
author: price-watch
protocol_version: 1
connector_version: 0.1.0
# Off until it has been tried against the live shop and its robots.txt has been read; then Enable it.
enabled: false
access_review: approved
access_note: >-
  ICA has approved use of its website and online food catalogs for price retrieval by Price
  Watch (owner-reported, 2026-11-27). ICA's IT team said there is no API and that the approved
  method is to request the pages with the browser-style headers in request_headers (their example,
  received 2026-11-27; update them when ICA does) and read prices from the HTML. Reads the pages
  of ICA's online shop (handlaprivatkund.ica.se, an Ocado-based storefront): the search page and
  product pages, whose products are tiles (data-test="fop-...") and, in the original investigation,
  window.__INITIAL_STATE__ and schema.org JSON-LD. No key or login; targeted lookups only. The tile
  layout was taken from saved pages of the store start page and of a search
  (/stores/<storeId>/search?q=...); product pages and the raw (non-browser-rendered) HTML are
  tested on fixtures only; it has not yet been run against the live shop, and
  its robots.txt has not been read (do that before enabling, and set the spacing and any visit
  window to match). A product's address is assumed to accept the bare id
  (/stores/<storeId>/products/<id>), redirecting to the canonical page; if not, add-by-link and
  lookups by id will report the product as missing. Prices are the online prices of the chosen
  store. No barcode is published. `available` means orderable, so stock is taken only from
  JSON-LD. Member (stammis) prices need a login and are not read. A 401/403 pauses the connector.
implementation: connector:IcaConnector
follow_redirects: true
# ICA IT's example request (2026-11-27). A retailer-approved exception to the no-disguise limit.
request_headers:
  User-Agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/158.0.0.0 Safari/537.36"
  Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8"
  Accept-Language: "en-US,en;q=0.9"
  Cache-Control: "max-age=0"
  Upgrade-Insecure-Requests: "1"
  Sec-Fetch-Dest: document
  Sec-Fetch-Mode: navigate
  Sec-Fetch-Site: none
  Sec-Fetch-User: "?1"
  Sec-CH-UA: '"Chromium";v="158", "Google Chrome";v="158"'
  Sec-CH-UA-Mobile: "?0"
  Sec-CH-UA-Platform: '"Linux"'
capabilities:
  store_discovery: unsupported
  product_search: supported
  barcode_search: unsupported
  online_prices: supported
  physical_store_prices: unsupported
  store_offers: unsupported
allowed_hosts: [handlaprivatkund.ica.se]
# Store ids are ICA's online-shop store ids (the number in the shop's address).
stores:
  - {external_id: "1003395", name: ICA Supermarket Höör}
product_urls:
  - pattern: '^https://handlaprivatkund\.ica\.se/stores/\d+/products/(?:[^/?#]+/)?(?P<sku>[A-Za-z0-9_-]+)$'
    example: 'https://handlaprivatkund.ica.se/stores/1003395/products/mellanmjolk-1-5/123456'
minimum_request_interval_seconds: 10
minimum_monitor_interval_minutes: 60
max_requests_per_scan: 6
max_requests_per_day: 200
cache_seconds: 3600

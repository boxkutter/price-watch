name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: retail
          POSTGRES_PASSWORD: retail
          POSTGRES_DB: retail
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U retail -d retail"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: latest-known
      - run: uv sync --extra dev --frozen --python 3.12
      - run: uv run --no-sync ruff check app tests migrations
      # SQLite (default) is fast; PostgreSQL covers row locking and real column types.
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://retail:retail@localhost:5432/retail
      # Migrations must apply to an empty PostgreSQL database and match the models.
      - run: PGPASSWORD=retail psql -h localhost -U retail -d retail -c 'CREATE DATABASE migrated'
      - run: |
          uv run --no-sync alembic upgrade head
          uv run --no-sync alembic check
        env:
          DATABASE_URL: postgresql+psycopg://retail:retail@localhost:5432/migrated
